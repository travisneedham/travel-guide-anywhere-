name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle internals AND the sherpa-onnx AAR (54 MB, downloaded
      # at configuration time by the run{} block in app/build.gradle.kts).
      - name: Cache Gradle & libs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "apk=TravelGuide-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Use the HEAD commit message, minus the session URL line
          CHANGES=$(git log -1 --pretty=format:"%B" | grep -v "^https://claude\.ai")
          if [ -z "$CHANGES" ]; then
            CHANGES="See commit history for details."
          fi
          {
            echo "changes<<NOTES_EOF"
            echo "$CHANGES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/${{ steps.version.outputs.apk }}

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## What's New

            ${{ steps.notes.outputs.changes }}

            ## Install on your Android device

            1. Tap **${{ steps.version.outputs.apk }}** below to download
            2. Open the file on your phone
            3. If prompted, allow "Install from unknown sources" for your browser/files app
          files: app/build/outputs/apk/debug/${{ steps.version.outputs.apk }}
          make_latest: true
